[project]
name = "gx-auth-sdk"
version = "0.1.0"
description = "Consumer SDK for the gx-auth authorization plane (OpenFGA + gx-auth control plane)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openfga-sdk>=0.9",
    "httpx",
]

[project.optional-dependencies]
# Framework glue (require() decorator, stub identity). Install as gx-auth-sdk[ninja].
ninja = ["django-ninja>=1.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gx_auth_sdk"]
