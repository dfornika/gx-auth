# OpenFGA model tests for the RBAC + hierarchy model. Run offline with:
#   just fga-model-test
name: gx-auth RBAC + hierarchy model

model_file: ./model.fga

# Fixture:
#   project:1 (root)  <- project:2 (child)  <- project:3 (grandchild)
#     project:1: anne=admin, bob=member, carol=viewer
#     project:2: dave=viewer   (direct role on the child only)
#   sample:s1 -> project:1 ; sample:s2 -> project:2 ; analysis_output:a1 -> project:1
#   platform:gx: olga=admin, svc-sds=delegate
#     project:4 is attached to platform:gx by a STORED edge (only as a model
#     test; the control plane supplies this edge contextually instead).
tuples:
  - user: user:anne
    relation: admin
    object: project:1
  - user: user:bob
    relation: member
    object: project:1
  - user: user:carol
    relation: viewer
    object: project:1
  - user: user:dave
    relation: viewer
    object: project:2

  # project:2's parent is project:1 ; project:3's parent is project:2
  - user: project:1
    relation: parent
    object: project:2
  - user: project:2
    relation: parent
    object: project:3

  - user: project:1
    relation: project
    object: sample:s1
  - user: project:2
    relation: project
    object: sample:s2
  - user: project:1
    relation: project
    object: analysis_output:a1

  - user: user:olga
    relation: admin
    object: platform:gx
  - user: user:svc-sds
    relation: delegate
    object: platform:gx
  - user: platform:gx
    relation: platform
    object: project:4

tests:
  - name: matrix-on-the-project-where-roles-are-assigned
    check:
      - user: user:anne
        object: project:1
        assertions:
          can_view: true
          can_create: true
          can_edit: true
          can_delete: true
          can_administer: true
      - user: user:bob
        object: project:1
        assertions:
          can_edit: true
          can_delete: false
          can_administer: false
      - user: user:carol
        object: project:1
        assertions:
          can_view: true
          can_edit: false

  - name: roles-inherit-DOWN-the-tree
    check:
      # anne is admin of the root -> admin of child and grandchild
      - user: user:anne
        object: project:2
        assertions:
          can_edit: true
          can_delete: true
          can_administer: true
      - user: user:anne
        object: project:3
        assertions:
          can_delete: true
      # bob is member of the root -> can edit down the tree, never delete
      - user: user:bob
        object: project:3
        assertions:
          can_edit: true
          can_delete: false
      # carol is viewer of the root -> can view down the tree, never edit
      - user: user:carol
        object: project:3
        assertions:
          can_view: true
          can_edit: false

  - name: inheritance-is-downward-only
    check:
      # dave has a role only on the child; it must NOT reach the parent
      - user: user:dave
        object: project:2
        assertions:
          can_view: true
      - user: user:dave
        object: project:1
        assertions:
          can_view: false
      - user: user:dave
        object: project:3
        assertions:
          can_view: true  # dave's role on project:2 DOES flow to its child project:3

  - name: unrelated-user-denied
    check:
      - user: user:erin
        object: project:1
        assertions:
          can_view: false

  - name: leaf-resources-inherit-through-the-hierarchy
    check:
      # sample:s2 is under the CHILD project:2; anne/carol have roles on the root
      - user: user:anne
        object: sample:s2
        assertions:
          can_view: true
          can_edit: true
      - user: user:carol
        object: sample:s2
        assertions:
          can_view: true
          can_edit: false
      - user: user:dave
        object: sample:s1
        assertions:
          can_view: false  # s1 is under the root, dave only has the child

  - name: list-objects-spans-the-subtree
    list_objects:
      # anne (admin of root) sees the whole project subtree
      - user: user:anne
        type: project
        assertions:
          can_view:
            - project:1
            - project:2
            - project:3
      # dave (child only) sees the child and its descendant, not the root
      - user: user:dave
        type: project
        assertions:
          can_view:
            - project:2
            - project:3
      - user: user:anne
        type: sample
        assertions:
          can_view:
            - sample:s1
            - sample:s2

  - name: platform-admin-reaches-projects-only-through-a-platform-edge
    check:
      # project:4 carries a platform edge -> olga is admin there
      - user: user:olga
        object: project:4
        assertions:
          admin: true
          can_administer: true
          can_view: true
      # project:1 has no platform edge -> olga holds nothing on it. This is
      # the default for real projects: platform admin is a control-plane role.
      - user: user:olga
        object: project:1
        assertions:
          admin: false
          can_administer: false
          can_view: false

  # The control plane supplies the platform edge contextually when it
  # authorizes a grant; these per-test tuples stand in for that.
  - name: contextual-platform-edge-lets-platform-admin-manage-any-project
    tuples:
      - user: platform:gx
        relation: platform
        object: project:1
    check:
      - user: user:olga
        object: project:1
        assertions:
          can_administer: true
      # and it flows down the tree like any admin role
      - user: user:olga
        object: project:3
        assertions:
          can_administer: true
      # a delegate is not an admin, edge or no edge
      - user: user:svc-sds
        object: project:1
        assertions:
          can_administer: false

  - name: delegate-grants-no-project-access
    check:
      - user: user:svc-sds
        object: platform:gx
        assertions:
          delegate: true
          admin: false
      - user: user:svc-sds
        object: project:4
        assertions:
          can_view: false
          can_administer: false
