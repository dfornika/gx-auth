[project]
name = "gx-auth-api"
version = "2026.7.1"
description = "Shared authorization control plane for the GX platform (Django Ninja + OpenFGA)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0,<6.1",
    "django-ninja>=1.6.0,<1.7.0",
    "environs[django]",
    "psycopg[binary]",
    "mozilla-django-oidc>=4.0.0",
    "openfga-sdk>=0.9.0",
    "django-prodserver[gunicorn]",
    "django-health-check>=4.0.0",
    "django-unfold>=0.99.0",
    "whitenoise",
]

[dependency-groups]
dev = [
    "model-bakery",
    "pre-commit>=4.6.0",
    "pytest",
    "pytest-django",
    "ruff>=0.15.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = "--reuse-db"
